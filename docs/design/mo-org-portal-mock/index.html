<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SPIN — MO / Org portal (IA mock)</title>
  <link rel="stylesheet" href="../provider-workspace-mock/style.css">
  <link rel="stylesheet" href="../csp-home-impact-mock/mock.css">
  <link rel="stylesheet" href="mock.css">
</head>
<body>
  <div class="designbar">
    <span><b>DESIGN PREVIEW</b> · MO / Org IA · Synthetic records · No live connections</span>
    <div>
      <label class="sr" for="screen">Choose mock screen</label>
      <select id="screen"></select>
      <label class="sr" for="state">Preview state</label>
      <select id="state">
        <option value="ready">Populated</option>
        <option value="empty">Empty</option>
        <option value="error">Unavailable</option>
        <option value="restricted">Restricted</option>
      </select>
      <a href="../mo-org-portal-product-brief.html">Product brief ↗</a>
      <a href="../system-overview-mock/pages.html">079 Systems mock ↗</a>
    </div>
  </div>
  <div class="workspace-strip">
    <strong>14th CSW</strong>
    <span>Organization workspace · Mission Owner</span>
  </div>
  <header class="topbar org-topbar">
    <a class="brand" href="#home">SPIN<span>AGENT</span></a>
    <nav class="orgtops" id="orgtops" aria-label="Organization navigation"></nav>
    <div class="topactions"><span class="caption">Synthetic</span><span class="avatar">MO</span></div>
  </header>
  <div class="layout">
    <aside id="sidebar"></aside>
    <main id="main" tabindex="-1">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="pagehead">
        <div>
          <div class="eyebrow" id="eyebrow"></div>
          <h1 id="title"></h1>
          <p id="description"></p>
        </div>
        <div class="actions" id="actions"></div>
      </div>
      <nav id="tabs" aria-label="Section pages"></nav>
      <div id="content"></div>
    </main>
  </div>
  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden>
    <header>
      <div>
        <p class="eyebrow">Record editor</p>
        <h2 id="drawerTitle"></h2>
        <p id="drawerDesc" class="caption"></p>
      </div>
      <button type="button" id="drawerClose" aria-label="Close drawer">×</button>
    </header>
    <div id="drawerBody" class="drawer-body"></div>
    <div id="drawerActions" class="drawer-actions"></div>
  </aside>
  <dialog id="dialog" aria-labelledby="dialogTitle">
    <div class="dialoghead"><span class="eyebrow">DESIGN SIMULATION</span><button id="close" aria-label="Close dialog">×</button></div>
    <h2 id="dialogTitle"></h2>
    <div id="dialogBody"></div>
    <div class="dialogactions" id="dialogActions"></div>
  </dialog>
  <div role="status" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>

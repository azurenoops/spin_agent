<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPIN — Provider workspace design</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="designbar"><span><b>DESIGN PREVIEW</b> · Synthetic records · No live connections</span><div><label class="sr" for="screen">Choose mock screen</label><select id="screen"></select><label class="sr" for="state">Preview state</label><select id="state"><option value="ready">Populated</option><option value="empty">Empty</option><option value="error">Unavailable</option><option value="restricted">Restricted</option></select><a href="gallery.html">All screens ↗</a></div></div>

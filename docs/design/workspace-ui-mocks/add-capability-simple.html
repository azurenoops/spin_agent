<div class="viz-dotted-background" style="padding:16px">
<section id="spin-add-capability" aria-label="Simplified add capability workflow">
  <div class="ac-demo"><span>Interactive proposal · sample data only</span><label for="ac-scenario">Organization library <select id="ac-scenario"><option value="empty">Empty result shown in screenshot</option><option value="sample">Sample populated library</option></select></label></div>
  <header><small>SPIN DEMO SYSTEM · APPLIED CAPABILITIES</small><h1>Add a security capability</h1><p>Choose a source, check where it applies, and review what will be added.</p></header>
  <div class="ac-source" aria-label="Capability source"><button data-source="org" class="ac-selected"><i data-lucide="building-2" aria-hidden="true"></i><span><strong>Our organization</strong><small>Policies, processes, and shared internal services.</small></span></button><button data-source="provider"><i data-lucide="cloud" aria-hidden="true"></i><span><strong>A provider service</strong><small>Published capabilities tied to a service scope and release.</small></span></button></div>
  <div class="ac-steps" aria-label="Workflow progress"><span data-step="1">1 · Choose</span><span data-step="2">2 · Check scope</span><span data-step="3">3 · Review</span></div>
  <div id="ac-content"></div><div id="ac-message" aria-live="polite"></div>
  <footer><button id="ac-back">Cancel</button><span id="ac-selection"></span><button id="ac-next" class="ac-primary" hidden>Continue</button></footer>
</section>
</div>
<style>
#spin-add-capability{--ac-bg:light-dark(#fff,#1a1e29);--ac-ink:light-dark(#1c2946,#e5e9f4);--ac-muted:light-dark(#65738f,#afbad0);--ac-line:light-dark(#dce1ee,#3b455b);--ac-soft:light-dark(#f7f8fc,#252b3b);--ac-purple:light-dark(#6247ff,#b5a7ff);--ac-selected:light-dark(#f1edff,#312b51);color:var(--ac-ink);background:var(--ac-bg);font:14px/1.5 system-ui,sans-serif;border:1px solid var(--ac-line);border-radius:10px;overflow:hidden;color-scheme:light dark}
#spin-add-capability *{box-sizing:border-box}#spin-add-capability [hidden]{display:none!important}#spin-add-capability button,#spin-add-capability input,#spin-add-capability select,#spin-add-capability textarea{font:inherit;color:var(--ac-ink);background:var(--ac-bg);border:1px solid var(--ac-line);border-radius:5px;padding:9px 12px;max-width:100%}#spin-add-capability button{cursor:pointer}#spin-add-capability button:focus-visible,#spin-add-capability textarea:focus-visible,#spin-add-capability select:focus-visible{outline:2px solid var(--ac-purple);outline-offset:2px}#spin-add-capability button:disabled{opacity:.5;cursor:default}#spin-add-capability .ac-demo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ac-soft);color:var(--ac-muted);padding:10px 20px;font-size:12px;border-bottom:1px solid var(--ac-line)}#spin-add-capability .ac-demo label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#spin-add-capability .ac-demo select{font-size:12px;padding:5px 7px}#spin-add-capability header{padding:24px 24px 18px}#spin-add-capability small{display:block;color:var(--ac-muted);font-size:12px}#spin-add-capability header small{font-size:11px;letter-spacing:.05em}#spin-add-capability h1{font-size:22px;line-height:1.3;font-weight:600;margin:8px 0}#spin-add-capability h2{font-size:17px;font-weight:600;margin:0 0 8px}#spin-add-capability h3{font-size:14px;font-weight:600;margin:0 0 5px}#spin-add-capability p{margin:5px 0;color:var(--ac-muted)}#spin-add-capability .ac-source{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 24px 20px}#spin-add-capability .ac-source button{display:flex;gap:10px;text-align:left;padding:13px;align-items:start}#spin-add-capability .ac-source svg{margin-top:3px;flex-shrink:0}#spin-add-capability .ac-source strong{font-weight:500}#spin-add-capability .ac-source small{margin-top:4px}#spin-add-capability .ac-selected{border-color:var(--ac-purple);background:var(--ac-selected)}#spin-add-capability .ac-steps{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:13px 24px;border-top:1px solid var(--ac-line);border-bottom:1px solid var(--ac-line);font-size:12px;color:var(--ac-muted)}#spin-add-capability .ac-current{color:var(--ac-purple);font-weight:600}#spin-add-capability #ac-content{padding:24px}#spin-add-capability .ac-empty{padding:12px 0}#spin-add-capability .ac-empty>i{color:var(--ac-muted)}#spin-add-capability .ac-empty h2{margin-top:12px}#spin-add-capability .ac-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}#spin-add-capability .ac-primary{background:var(--ac-purple);border-color:var(--ac-purple);color:var(--ac-bg)}#spin-add-capability .ac-link{background:transparent;border:0;padding:0;color:var(--ac-purple);text-align:left;font-size:13px}#spin-add-capability .ac-search{display:block;width:100%;margin-bottom:14px}#spin-add-capability .ac-choice{display:flex;gap:12px;align-items:start;padding:15px;border:1px solid var(--ac-line);border-radius:6px;margin:9px 0;cursor:pointer}#spin-add-capability .ac-choice:has(input:checked){border-color:var(--ac-purple);background:var(--ac-selected)}#spin-add-capability .ac-choice input{accent-color:var(--ac-purple);margin-top:4px;flex-shrink:0}#spin-add-capability .ac-choice strong{font-weight:500}#spin-add-capability .ac-choice small{margin-top:4px}#spin-add-capability .ac-scope-info{background:var(--ac-soft);padding:13px;border-radius:5px;font-size:13px;margin-bottom:15px}#spin-add-capability .ac-field{display:block;font-size:13px;font-weight:500;margin:14px 0 6px}#spin-add-capability textarea{display:block;width:100%;min-height:90px;resize:vertical;margin:7px 0}#spin-add-capability .ac-row{padding:14px 0;border-bottom:1px solid var(--ac-line)}#spin-add-capability .ac-row:last-child{border:0}#spin-add-capability .ac-check{display:flex;gap:8px;align-items:start;font-size:13px;margin-top:16px}#spin-add-capability .ac-check input{accent-color:var(--ac-purple);margin-top:4px}#spin-add-capability .ac-note{padding:12px;background:var(--ac-soft);border-radius:5px;margin-top:16px;font-size:12px;color:var(--ac-muted)}#spin-add-capability #ac-message{padding:0 24px 16px;font-size:12px;color:var(--ac-purple)}#spin-add-capability #ac-message:empty{display:none}#spin-add-capability footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ac-line);padding:16px 24px}#spin-add-capability footer span{flex:1;font-size:12px;color:var(--ac-muted)}#spin-add-capability footer button{font-size:13px}#spin-add-capability details{margin-top:16px}#spin-add-capability summary{font-size:12px;color:var(--ac-purple);cursor:pointer}
@media(max-width:460px){#spin-add-capability .ac-source{grid-template-columns:1fr}#spin-add-capability header,#spin-add-capability .ac-source,#spin-add-capability .ac-steps,#spin-add-capability #ac-content,#spin-add-capability footer{padding-left:16px;padding-right:16px}#spin-add-capability textarea,#spin-add-capability .ac-search{font-size:16px}}
</style>
<script>
(()=>{const root=document.getElementById('spin-add-capability');const org=[{id:'access',name:'Organization access management',description:'Example internal policy and process for managing system access.',owner:'Organization identity team'},{id:'incident',name:'Incident response support',description:'Example internal service for reporting and coordinating incidents.',owner:'Organization security operations'}];const provider=[{id:'mail',name:'Exchange Online collaboration mail',description:'Example published mail capability from the selected service release.',owner:'Flankspeed'}];let s={kind:'add-capability-simple',source:'org',scenario:'empty',step:1,selected:[],query:'',scope:'',added:false};const p=window.openai?.widgetState?.privateContent;if(p?.kind===s.kind)s={...s,...p};const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const items=()=>s.source==='org'?org:provider;const chosen=()=>items().filter(x=>s.selected.includes(x.id));const note=t=>root.querySelector('#ac-message').textContent=t;const persist=()=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{source:s.source,step:s.step,selected:chosen().map(x=>x.name),mockDraftAdded:s.added},privateContent:s}).catch(()=>{});};
function buttonState(){const b=root.querySelector('#ac-next');b.disabled=s.step===1?!s.selected.length:s.step===2?!s.scope.trim():!root.querySelector('#ac-ack')?.checked;}
function render(){root.querySelector('#ac-scenario').value=s.scenario;root.querySelectorAll('[data-source]').forEach(b=>{b.classList.toggle('ac-selected',b.dataset.source===s.source);b.setAttribute('aria-pressed',String(b.dataset.source===s.source));});root.querySelectorAll('[data-step]').forEach(x=>{x.classList.toggle('ac-current',Number(x.dataset.step)===s.step);if(Number(x.dataset.step)===s.step)x.setAttribute('aria-current','step');else x.removeAttribute('aria-current');});const c=root.querySelector('#ac-content');const empty=s.source==='org'&&s.scenario==='empty';const next=root.querySelector('#ac-next');next.hidden=empty||s.added;next.textContent=s.step===1?'Check applicability →':s.step===2?'Review draft additions →':'Add as draft';root.querySelector('#ac-back').textContent=s.step===1?'Cancel':'Back';root.querySelector('#ac-selection').textContent=s.selected.length?`${s.selected.length} selected · SPIN Demo System`:'SPIN Demo System';
if(s.added){c.innerHTML=`<h2>Draft additions recorded in this mock</h2><p>${chosen().map(x=>esc(x.name)).join(', ')}</p><div class="ac-note">Applicability, responsibility, and evidence still need review. No inheritance or control satisfaction was confirmed.</div><div class="ac-actions"><button data-action="restart">Return to selection</button></div>`;}
else if(empty){c.innerHTML=`<div class="ac-empty"><i data-lucide="library" aria-hidden="true"></i><h2>No organization capabilities available to select</h2><p>The current result is empty. Use a provider service, or inspect the organization library.</p><small>The screenshot does not establish whether records are missing, filtered, already applied, or unavailable to your role.</small><div class="ac-actions"><button class="ac-primary" data-action="provider">Choose a provider service</button><button data-action="library">Review organization library</button></div><details><summary>What happens to my work if I leave?</summary><p>Your draft selections should be preserved. Leaving this flow must not delete existing system or shared library records.</p></details></div>`;}
else if(s.step===1){c.innerHTML=`${s.source==='provider'?'<div class="ac-scope-info"><strong>Provider source · sample setup</strong><p>Flankspeed → Microsoft 365 · Collaboration</p><small>Pinned scope revision 1 · published capability revision 2 · synthetic release</small><small>This path requires the exact provider scope and released capability. No organization-library substitution.</small></div>':''}<h2>${s.source==='org'?'Choose organization capabilities':'Choose from this provider release'}</h2><input class="ac-search" id="ac-search" placeholder="Search by capability name" aria-label="Search capabilities" value="${esc(s.query)}"><div id="ac-list"></div><small>All listed capabilities here are synthetic examples, not your actual library.</small>`;renderList();}
else if(s.step===2){c.innerHTML=`<h2>Where will these capabilities apply?</h2><p>${chosen().map(x=>esc(x.name)).join(' · ')}</p><label class="ac-field" for="ac-scope">System scope and intended use</label><textarea id="ac-scope" rows="4" placeholder="Name the system components, users, or processes covered, and any exclusions.">${esc(s.scope)}</textarea><small>Prepared drafts can suggest wording from verified records. You review and correct the applicable scope.</small><div class="ac-actions"><button class="ac-link" data-action="suggest">Prepare an example first pass</button></div><div class="ac-note">Application to the system, accepted responsibilities, and verified implementation remain separate decisions.</div>`;}
else{c.innerHTML=`<h2>Review what will be added</h2>${chosen().map(x=>`<div class="ac-row"><h3>${esc(x.name)}</h3><small>Source: ${s.source==='org'?'Organization library': 'Flankspeed · Microsoft 365 scope, pinned release'}</small><small>Status after addition: Draft · review required</small></div>`).join('')}<div class="ac-row"><h3>Proposed applicability</h3><p style="white-space:pre-wrap">${esc(s.scope)}</p></div><label class="ac-check"><input id="ac-ack" type="checkbox"><span>Add these as drafts. Responsibility review and supporting evidence remain open.</span></label><small style="margin-top:14px">Provider duties are carried over from the published source. AI suggestions supplement only supported gaps.</small>`;}buttonState();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function renderList(){const list=root.querySelector('#ac-list');if(!list)return;const filtered=items().filter(x=>(x.name+' '+x.description).toLowerCase().includes(s.query.toLowerCase()));list.innerHTML=filtered.length?filtered.map(x=>`<label class="ac-choice"><input type="checkbox" value="${x.id}" data-choice="true" ${s.selected.includes(x.id)?'checked':''}><span><strong>${esc(x.name)}</strong><small>${esc(x.description)}</small><small>Owner: ${esc(x.owner)}</small></span></label>`).join(''):'<p>No matches for this search.</p><button class="ac-link" data-action="clear-search">Clear search</button>';}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.source){if(s.source!==b.dataset.source){s.source=b.dataset.source;s.selected=[];s.step=1;s.added=false;s.scope='';s.query='';}note('');}else switch(b.dataset.action){case'provider':s.source='provider';s.selected=[];s.step=1;note('Sample provider path shown. Production must use a verified scope and release.');break;case'library':note('In production, open the organization library with this system and organization context preserved. This mock does not access the library.');return;case'clear-search':s.query='';break;case'suggest':s.scope='AI example draft: Confirm which recorded system components, users, and processes are covered by the selected capability. Add verified scope details and exclusions before review.';note('Example wording prepared. This is not verified system applicability.');break;case'restart':s.added=false;s.step=1;break;}if(b.id==='ac-next'){if(s.step<3){s.step++;note('');}else if(root.querySelector('#ac-ack')?.checked){s.added=true;note('Draft additions recorded in this mock only. No system data was changed.');}}if(b.id==='ac-back'){if(s.step>1){s.step--;s.added=false;}else{note('Cancelled in this mock. Existing records are unchanged and your draft selections remain available.');return;}}render();persist();});root.querySelector('#ac-scenario').addEventListener('change',e=>{s.scenario=e.target.value;s.step=1;s.selected=[];s.scope='';s.added=false;render();note('Mock library scenario changed. Your real library was not queried.');persist();});root.addEventListener('change',e=>{if(e.target.dataset.choice){s.selected=e.target.checked?[...s.selected,e.target.value]:s.selected.filter(x=>x!==e.target.value);root.querySelector('#ac-selection').textContent=s.selected.length?`${s.selected.length} selected · SPIN Demo System`:'SPIN Demo System';buttonState();persist();}if(e.target.id==='ac-ack')buttonState();});root.addEventListener('input',e=>{if(e.target.id==='ac-search'){s.query=e.target.value;renderList();}if(e.target.id==='ac-scope'){s.scope=e.target.value;buttonState();persist();}});window.addEventListener('openai:set_globals',e=>{const p=e.detail?.globals?.widgetState?.privateContent;if(p?.kind===s.kind){s={...s,...p};render();}});render();})();
</script>

name: Reusable - Deploy Container App Stage

on:
  workflow_call:
    inputs:
      environment_name:
        description: GitHub environment name (dev, test, production)
        required: true
        type: string
      workload:
        description: Workload type (mcp or dashboard)
        required: false
        default: mcp
        type: string
      image:
        description: Fully-qualified container image to deploy
        required: true
        type: string
      containerapp_name:
        description: Optional Container App name override
        required: false
        default: ""
        type: string
      containerapp_env_name:
        description: Optional Container Apps environment name override
        required: false
        default: ""
        type: string
      target_port:
        description: Container App ingress target port
        required: false
        default: "3001"
        type: string
      health_path:
        description: Health check path to validate deployment
        required: false
        default: /health
        type: string
      include_mcp_env_vars:
        description: Whether to include MCP-specific environment variables
        required: false
        default: true
        type: boolean
      mcp_base_url_override:
        description: Optional MCP base URL override for dashboard deployments
        required: false
        default: ""
        type: string
      assign_managed_identity:
        description: Whether to assign a system-assigned managed identity
        required: false
        default: true
        type: boolean
      inject_runtime_secrets:
        description: Whether to set optional runtime secrets and secretref env vars
        required: false
        default: false
        type: boolean
      extra_env_vars:
        description: |
          Additional space-separated env var KEY=VALUE pairs to append to the container
          app's env vars. Used to pass deployment-specific flags such as
          FORCE_SINGLE_TENANT=true for org-only dashboard instances (Feature 411).
          Values must not contain spaces. Example: "FORCE_SINGLE_TENANT=true FOO=bar"
        required: false
        default: ""
        type: string
      min_replicas:
        description: "Minimum replica count. Set to 1+ to disable cold-start (scale-to-zero)."
        required: false
        default: "1"
        type: string
      max_replicas:
        description: Maximum replica count for autoscaling.
        required: false
        default: "5"
        type: string
      cpu:
        description: "vCPU request per replica (e.g. 0.5, 1.0, 2.0). .NET 9 needs >= 0.5."
        required: false
        default: "1.0"
        type: string
      memory:
        description: "Memory request per replica (e.g. 1.0Gi, 2.0Gi). Must pair with cpu (cpu*2 == memoryGi typical)."
        required: false
        default: "2.0Gi"
        type: string
      http_scale_concurrency:
        description: Concurrent HTTP requests per replica that triggers scale-out.
        required: false
        default: "50"
        type: string
      enable_session_affinity:
        description: "Enable sticky sessions on ingress (REQUIRED for SignalR with >1 replica)."
        required: false
        default: true
        type: boolean
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      ATO_DB_CONNECTION_STRING:
        required: false
      ATO_AZUREAI_APIKEY:
        required: false
      ATO_AZUREAD_CLIENTSECRET:
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Needed so deploy steps can source scripts/ci/az-containerapp-mutate.sh (#872).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate stage configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ vars.AZURE_RESOURCE_GROUP }}" || (echo "Missing environment variable: AZURE_RESOURCE_GROUP" && exit 1)
          if [ "${{ inputs.workload }}" = "mcp" ]; then
            AUTH_CLIENT_ID="${{ vars.ATO_AUTH_MSAL_CLIENTID || '' }}"
            AUTH_AUTHORITY="${{ vars.ATO_AUTH_MSAL_AUTHORITY || '' }}"
            AUTH_REDIRECT_URI="${{ vars.ATO_AUTH_MSAL_REDIRECTURI || '' }}"
            AUTH_POST_LOGOUT_REDIRECT_URI="${{ vars.ATO_AUTH_MSAL_POSTLOGOUTREDIRECTURI || '' }}"
            test -n "$AUTH_CLIENT_ID" || (echo "Missing environment variable: ATO_AUTH_MSAL_CLIENTID" && exit 1)
            test -n "$AUTH_AUTHORITY" || (echo "Missing environment variable: ATO_AUTH_MSAL_AUTHORITY" && exit 1)
            test -n "$AUTH_REDIRECT_URI" || (echo "Missing environment variable: ATO_AUTH_MSAL_REDIRECTURI" && exit 1)
            test -n "$AUTH_POST_LOGOUT_REDIRECT_URI" || (echo "Missing environment variable: ATO_AUTH_MSAL_POSTLOGOUTREDIRECTURI" && exit 1)
            case "$AUTH_AUTHORITY" in
              https://login.microsoftonline.com/*/) echo "Invalid ATO_AUTH_MSAL_AUTHORITY: expected https://host/tenant-id without a trailing slash"; exit 1 ;;
              https://login.microsoftonline.com/*) ;;
              https://login.microsoftonline.us/*/) echo "Invalid ATO_AUTH_MSAL_AUTHORITY: expected https://host/tenant-id without a trailing slash"; exit 1 ;;
              https://login.microsoftonline.us/*) ;;
              *) echo "Invalid ATO_AUTH_MSAL_AUTHORITY: expected an Azure Public or Government authority with tenant ID"; exit 1 ;;
            esac
            case "$AUTH_REDIRECT_URI" in
              https://*) ;;
              *) echo "Invalid ATO_AUTH_MSAL_REDIRECTURI: expected an https URL"; exit 1 ;;
            esac
            case "$AUTH_POST_LOGOUT_REDIRECT_URI" in
              https://*) ;;
              *) echo "Invalid ATO_AUTH_MSAL_POSTLOGOUTREDIRECTURI: expected an https URL"; exit 1 ;;
            esac
          elif [ "${{ inputs.workload }}" = "chat" ]; then
            CHAT_CLIENT_ID="${{ vars.ATO_AUTH_MSAL_CLIENTID || '' }}"
            CHAT_AUTHORITY="${{ vars.ATO_AUTH_MSAL_AUTHORITY || '' }}"
            test -n "$CHAT_CLIENT_ID" || (echo "Missing environment variable: ATO_AUTH_MSAL_CLIENTID" && exit 1)
            test -n "$CHAT_AUTHORITY" || (echo "Missing environment variable: ATO_AUTH_MSAL_AUTHORITY" && exit 1)
            test -n "${{ secrets.ATO_DB_CONNECTION_STRING || '' }}" || (echo "Missing environment secret: ATO_CHAT_DB_CONNECTION_STRING" && exit 1)
            case "$CHAT_AUTHORITY" in
              https://*/*/) echo "Invalid ATO_AUTH_MSAL_AUTHORITY: expected https://host/tenant-id without a trailing slash"; exit 1 ;;
              https://*/*) ;;
              *) echo "Invalid ATO_AUTH_MSAL_AUTHORITY: expected https://host/tenant-id"; exit 1 ;;
            esac
            if [ -z "${{ inputs.containerapp_name }}" ] && [ -z "${{ vars.AZURE_CHAT_CONTAINERAPP_NAME || '' }}" ]; then
              # Run 33777693029: test/prod have no env vars. Derive from MCP
              # name (${BASE_APP/-mcp/-chat}) the same way dashboard does.
              BASE_FOR_CHAT="${{ vars.AZURE_CONTAINERAPP_NAME || '' }}"
              case "$BASE_FOR_CHAT" in
                *-mcp*) ;;
                *)
                  echo "Missing environment variable: AZURE_CHAT_CONTAINERAPP_NAME"
                  echo "Refusing to deploy workload=chat onto AZURE_CONTAINERAPP_NAME (the MCP app)."
                  echo "Set AZURE_CHAT_CONTAINERAPP_NAME or name the MCP app with '-mcp' so chat can be derived."
                  exit 1
                  ;;
              esac
            fi
          elif [ -z "${{ inputs.containerapp_name }}" ] && [ -z "${{ vars.AZURE_CONTAINERAPP_NAME || '' }}" ]; then
            echo "Missing environment variable: AZURE_CONTAINERAPP_NAME"
            exit 1
          fi
          if [ -z "${{ inputs.containerapp_env_name }}" ] && [ -z "${{ vars.AZURE_CONTAINERAPP_ENV_NAME || '' }}" ]; then
            echo "Missing environment variable: AZURE_CONTAINERAPP_ENV_NAME"
            exit 1
          fi
          test -n "${{ vars.AZURE_ACR_NAME }}" || (echo "Missing environment variable: AZURE_ACR_NAME" && exit 1)

      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          WORKLOAD="${{ inputs.workload }}"
          APP="${{ inputs.containerapp_name }}"
          BASE_APP="${{ vars.AZURE_CONTAINERAPP_NAME }}"

          if [ -z "$APP" ]; then
            if [ "$WORKLOAD" = "dashboard" ]; then
              APP="${{ vars.AZURE_DASHBOARD_CONTAINERAPP_NAME || '' }}"
              if [ -z "$APP" ]; then
                APP="${BASE_APP/-mcp/-dashboard}"
                if [ "$APP" = "$BASE_APP" ]; then
                  APP="${BASE_APP}-dashboard"
                fi
              fi
            elif [ "$WORKLOAD" = "chat" ]; then
              # CD 33771928221: empty AZURE_CHAT_CONTAINERAPP_NAME fell through
              # to BASE_APP and updated ca-ato-copilot-mcp-v2 with the Chat
              # image + port 8080. Derive like dashboard; never inherit MCP.
              APP="${{ vars.AZURE_CHAT_CONTAINERAPP_NAME || '' }}"
              if [ -z "$APP" ]; then
                APP="${BASE_APP/-mcp/-chat}"
                if [ "$APP" = "$BASE_APP" ]; then
                  APP="${BASE_APP}-chat"
                fi
              fi
            else
              APP="$BASE_APP"
            fi
          fi

          # Run 33777693029: Dev env swapped names (MCP→dashboard, Chat→MCP).
          # Refuse after resolve so an explicit wrong var cannot land either.
          if [ "$WORKLOAD" = "chat" ]; then
            case "$APP" in
              *chat*) ;;
              *)
                echo "Refusing to deploy workload=chat onto '${APP}' (name must contain 'chat')."
                echo "Set AZURE_CHAT_CONTAINERAPP_NAME to the Chat Container App (example: ca-ato-copilot-chat-v2)."
                exit 1
                ;;
            esac
          elif [ "$WORKLOAD" = "mcp" ]; then
            case "$APP" in
              *dashboard*|*chat*)
                echo "Refusing to deploy workload=mcp onto '${APP}' (MCP name must not contain dashboard or chat)."
                echo "Set AZURE_CONTAINERAPP_NAME to the MCP Container App (example: ca-ato-copilot-mcp-v2)."
                exit 1
                ;;
            esac
          fi

          # #region agent log
          echo "debug.session=3a8241 hypothesisId=E resolved workload=${WORKLOAD} app=${APP} base=${BASE_APP}"
          # #endregion

          ENV_NAME="${{ inputs.containerapp_env_name }}"
          if [ -z "$ENV_NAME" ]; then
            if [ "$WORKLOAD" = "dashboard" ]; then
              ENV_NAME="${{ vars.AZURE_DASHBOARD_CONTAINERAPP_ENV_NAME || '' }}"
            fi
            if [ -z "$ENV_NAME" ]; then
              ENV_NAME="${{ vars.AZURE_CONTAINERAPP_ENV_NAME }}"
            fi
          fi

          echo "app=${APP}" >> "$GITHUB_OUTPUT"
          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"

      # fix(WM-INFRA-2 follow-up): Replaced az acr credential show (admin password
      # written to GITHUB_OUTPUT in plain text on every deploy run) with a
      # login-server-only lookup. Container App image-pull now uses the app's
      # system-assigned managed identity (AcrPull role granted in the identity
      # step below) — no admin credential is fetched, stored, or emitted.
      - name: Resolve ACR login server
        id: acr
        shell: bash
        run: |
          set -euo pipefail
          LOGIN_SERVER=$(az acr show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_ACR_NAME }}" --query loginServer -o tsv)
          echo "login_server=${LOGIN_SERVER}" >> "$GITHUB_OUTPUT"

      - name: Ensure Container Apps environment exists (idempotent)
        shell: bash
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          ENV_NAME="${{ steps.target.outputs.env_name }}"

          # Prefer explicit location variable when defined; otherwise use RG location.
          LOCATION="${{ vars.AZURE_LOCATION || '' }}"
          if [ -z "$LOCATION" ]; then
            LOCATION=$(az group show -n "$RG" --query location -o tsv)
          fi

          LAW_NAME="law-${ENV_NAME}"

          LAW_ID=$(az monitor log-analytics workspace show \
            --resource-group "$RG" --workspace-name "$LAW_NAME" \
            --query customerId -o tsv 2>/dev/null || true)

          if [ -z "$LAW_ID" ]; then
            az monitor log-analytics workspace create \
              --resource-group "$RG" \
              --workspace-name "$LAW_NAME" \
              --location "$LOCATION" \
              --retention-time 30 >/dev/null
            LAW_ID=$(az monitor log-analytics workspace show \
              --resource-group "$RG" --workspace-name "$LAW_NAME" \
              --query customerId -o tsv)
          fi

          LAW_KEY=$(az monitor log-analytics workspace get-shared-keys \
            --resource-group "$RG" --workspace-name "$LAW_NAME" \
            --query primarySharedKey -o tsv)

          EXISTING_ENV=$(az containerapp env show \
            --name "$ENV_NAME" --resource-group "$RG" \
            --query id -o tsv 2>/dev/null || true)

          if [ -n "$EXISTING_ENV" ]; then
            echo "Container Apps environment '$ENV_NAME' already exists."
          else
            az containerapp env create \
              --name "$ENV_NAME" \
              --resource-group "$RG" \
              --location "$LOCATION" \
              --logs-workspace-id "$LAW_ID" \
              --logs-workspace-key "$LAW_KEY" \
              --enable-workload-profiles false >/dev/null
            echo "Created Container Apps environment '$ENV_NAME'."
          fi

      - name: Build env var arguments
        id: envargs
        shell: bash
        run: |
          set -euo pipefail
          ENV_ARGS_BASE=""
          if [ "${{ inputs.include_mcp_env_vars }}" = "true" ]; then
            ENV_ARGS_BASE="ASPNETCORE_URLS=http://+:3001 ATO_RUN_MODE=http"
            # ATO_GATEWAY_AZURE_CLOUDENVIRONMENT: repo var (required). Safe fallback is AzureCloud
            # (this deployment targets Azure Commercial, not Azure Government).
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_GATEWAY__AZURE__CLOUDENVIRONMENT=${{ vars.ATO_GATEWAY_AZURE_CLOUDENVIRONMENT || 'AzureCloud' }}"
            # ATO_AZUREAI_ENABLED: repo var (required). Safe fallback is true — AI is needed for
            # all MCP tool invocations. false causes startup to bypass AI client registration
            # but the revision still activates; the real issue is empty endpoint + enabled=true.
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_AZUREAI__ENABLED=${{ vars.ATO_AZUREAI_ENABLED || 'true' }}"
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_AZUREAI__PROVIDER=${{ vars.ATO_AZUREAI_PROVIDER || 'OpenAi' }}"
            # ATO_AZUREAI_ENDPOINT: repo var (required). Must be set — empty value prevents
            # AI client registration and causes revision activation failure.
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_AZUREAI__ENDPOINT=${{ vars.ATO_AZUREAI_ENDPOINT }}"
            # #649: GitHub `vars.X || fallback` only applies when the var is unset.
            # Run 33804223965 still injected repo var ATO_AZUREAI_DEPLOYMENTNAME=gpt-5.4-mini.
            DEPLOYMENT_NAME="${{ vars.ATO_AZUREAI_DEPLOYMENTNAME || 'gpt-4o-mini' }}"
            case "${DEPLOYMENT_NAME}" in
              gpt-5.4-mini|gpt-5-4-mini|"")
                echo "::warning::ATO_AZUREAI_DEPLOYMENTNAME='${DEPLOYMENT_NAME}' is not a valid Azure OpenAI deployment. Overriding to gpt-4o-mini. Admin must change repo/environment variable ATO_AZUREAI_DEPLOYMENTNAME."
                DEPLOYMENT_NAME="gpt-4o-mini"
                ;;
            esac
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_AZUREAI__DEPLOYMENTNAME=${DEPLOYMENT_NAME}"
            DATABASE_PROVIDER="${{ vars.ATO_DATABASE_PROVIDER || 'SqlServer' }}"
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_DATABASE__PROVIDER=${DATABASE_PROVIDER}"
            # ATO_DATABASE__MANAGEDIDENTITYCLIENTID: user-assigned MI client ID for SQL Server auth.
            # Without this, SqlClient falls back to the system-assigned identity on ACA hosts that
            # have both identity types — causing Error 18456 (Login failed). Set via repo variable.
            if [ -n "${{ vars.ATO_DATABASE__MANAGEDIDENTITYCLIENTID || '' }}" ]; then
              ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_DATABASE__MANAGEDIDENTITYCLIENTID=${{ vars.ATO_DATABASE__MANAGEDIDENTITYCLIENTID }}"
            fi
            AUTH_CLIENT_ID="${{ vars.ATO_AUTH_MSAL_CLIENTID }}"
            AUTH_AUTHORITY="${{ vars.ATO_AUTH_MSAL_AUTHORITY }}"
            AUTH_TENANT_ID="${AUTH_AUTHORITY##*/}"
            AUTH_INSTANCE="${AUTH_AUTHORITY%/*}/"
            case "${AUTH_INSTANCE}" in
              https://login.microsoftonline.com/) AUTH_CLOUD="AzurePublic" ;;
              https://login.microsoftonline.us/) AUTH_CLOUD="AzureUSGovernment" ;;
              *) echo "::error::Unsupported Entra authority instance '${AUTH_INSTANCE}'"; exit 1 ;;
            esac
            # Entra v2 access tokens identify a custom API by its application client ID in aud.
            AUTH_AUDIENCE="${AUTH_CLIENT_ID}"
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_AUTH__CLOUD=${AUTH_CLOUD}"
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_AUTH__MSAL__CLIENTID=${AUTH_CLIENT_ID}"
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_AUTH__MSAL__AUTHORITY=${AUTH_AUTHORITY}"
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_AUTH__MSAL__REDIRECTURI=${{ vars.ATO_AUTH_MSAL_REDIRECTURI }}"
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_AUTH__MSAL__POSTLOGOUTREDIRECTURI=${{ vars.ATO_AUTH_MSAL_POSTLOGOUTREDIRECTURI }}"
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_AZUREAD__INSTANCE=${AUTH_INSTANCE}"
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_AZUREAD__TENANTID=${AUTH_TENANT_ID}"
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_AZUREAD__CLIENTID=${AUTH_CLIENT_ID}"
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_AZUREAD__AUDIENCE=${AUTH_AUDIENCE}"
          elif [ "${{ inputs.workload }}" = "dashboard" ]; then
            MCP_OVERRIDE="${{ inputs.mcp_base_url_override }}"
            if [ -n "$MCP_OVERRIDE" ]; then
              ENV_ARGS_BASE="MCP_BASE_URL=${MCP_OVERRIDE}"
            else
              MCP_APP="${{ vars.AZURE_CONTAINERAPP_NAME }}"
              MCP_FQDN=$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${MCP_APP}" --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)
              if [ -n "${MCP_FQDN}" ]; then
                ENV_ARGS_BASE="MCP_BASE_URL=https://${MCP_FQDN}"
              fi
            fi
          elif [ "${{ inputs.workload }}" = "chat" ]; then
            CHAT_AUTHORITY="${{ vars.ATO_AUTH_MSAL_AUTHORITY }}"
            CHAT_TENANT_ID="${CHAT_AUTHORITY##*/}"
            CHAT_INSTANCE="${CHAT_AUTHORITY%/*}/"
            ENV_ARGS_BASE="ATO_AZUREAD__INSTANCE=${CHAT_INSTANCE}"
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_AZUREAD__TENANTID=${CHAT_TENANT_ID}"
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_AZUREAD__CLIENTID=${{ vars.ATO_AUTH_MSAL_CLIENTID }}"
            if [ -n "${{ vars.ATO_DATABASE__MANAGEDIDENTITYCLIENTID || '' }}" ]; then
              ENV_ARGS_BASE="${ENV_ARGS_BASE} ATO_DATABASE__MANAGEDIDENTITYCLIENTID=${{ vars.ATO_DATABASE__MANAGEDIDENTITYCLIENTID }}"
            fi
          fi

          SECRETREF_ARGS=""

          if [ "${{ inputs.inject_runtime_secrets }}" = "true" ]; then
            if [ -n "${{ secrets.ATO_DB_CONNECTION_STRING || '' }}" ]; then
              if [ "${{ inputs.workload }}" = "chat" ]; then
                SECRETREF_ARGS="${SECRETREF_ARGS} ATO_CONNECTIONSTRINGS__CHATDB=secretref:db-connection-string"
              else
                SECRETREF_ARGS="${SECRETREF_ARGS} ATO_CONNECTIONSTRINGS__DEFAULTCONNECTION=secretref:db-connection-string"
              fi
            fi
            if [ -n "${{ secrets.ATO_AZUREAI_APIKEY || '' }}" ]; then
              SECRETREF_ARGS="${SECRETREF_ARGS} ATO_AZUREAI__APIKEY=secretref:azureai-apikey"
            fi
            if [ -n "${{ secrets.ATO_AZUREAD_CLIENTSECRET || '' }}" ]; then
              SECRETREF_ARGS="${SECRETREF_ARGS} ATO_AZUREAD__CLIENTSECRET=secretref:azuread-client-secret"
            fi
          fi

          ENV_ARGS_WITH_SECRETS="${ENV_ARGS_BASE}${SECRETREF_ARGS}"
          # Feature 411: append caller-supplied extra vars (e.g. FORCE_SINGLE_TENANT=true).
          EXTRA="${{ inputs.extra_env_vars }}"
          if [ -n "${EXTRA}" ]; then
            ENV_ARGS_BASE="${ENV_ARGS_BASE} ${EXTRA}"
            ENV_ARGS_WITH_SECRETS="${ENV_ARGS_WITH_SECRETS} ${EXTRA}"
          fi
          echo "base=${ENV_ARGS_BASE}" >> "$GITHUB_OUTPUT"
          echo "with_secrets=${ENV_ARGS_WITH_SECRETS}" >> "$GITHUB_OUTPUT"

      - name: Create/update container app
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/az-containerapp-mutate.sh
          source "${GITHUB_WORKSPACE}/scripts/ci/az-containerapp-mutate.sh"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ steps.target.outputs.app }}"
          ENV_NAME="${{ steps.target.outputs.env_name }}"
          IMAGE="${{ inputs.image }}"
          ENV_ARGS="${{ steps.envargs.outputs.base }}"
          TARGET_PORT="${{ inputs.target_port }}"

          MIN_REPLICAS="${{ inputs.min_replicas }}"
          MAX_REPLICAS="${{ inputs.max_replicas }}"
          CPU="${{ inputs.cpu }}"
          MEMORY="${{ inputs.memory }}"
          HTTP_CONCURRENCY="${{ inputs.http_scale_concurrency }}"

          # Sized resource args that apply to BOTH create and update.
          RESOURCE_ARGS=(
            --min-replicas "${MIN_REPLICAS}"
            --max-replicas "${MAX_REPLICAS}"
            --cpu "${CPU}"
            --memory "${MEMORY}"
            --scale-rule-name http-rule
            --scale-rule-type http
            --scale-rule-http-concurrency "${HTTP_CONCURRENCY}"
          )

          create_app() {
            # Run 33804223965: binding ACR with a system identity at create
            # time makes `az` write AcrPull. The CD OIDC principal does not
            # have Microsoft.Authorization/roleAssignments/write, so
            # first-create of ca-ato-copilot-chat-v2 failed after targeting
            # was correct. Bind ACR after identity assign (registry set).
            # --no-wait: do not block on revision pull before registry is bound
            # (run 34387809098 expired the revision LRO after ~20m).
            if [ -n "${ENV_ARGS}" ]; then
              # shellcheck disable=SC2086
              az_containerapp_retry az containerapp create \
                --resource-group "${RG}" \
                --name "${APP}" \
                --environment "${ENV_NAME}" \
                --image "${IMAGE}" \
                --target-port "${TARGET_PORT}" \
                --ingress external \
                --no-wait \
                "${RESOURCE_ARGS[@]}" \
                --env-vars ${ENV_ARGS}
            else
              az_containerapp_retry az containerapp create \
                --resource-group "${RG}" \
                --name "${APP}" \
                --environment "${ENV_NAME}" \
                --image "${IMAGE}" \
                --target-port "${TARGET_PORT}" \
                --ingress external \
                --no-wait \
                "${RESOURCE_ARGS[@]}"
            fi
          }

          if az containerapp show -g "${RG}" -n "${APP}" >/dev/null 2>&1; then
            # Run 34635028916: do not start a revision LRO while Failed, then
            # wait for InProgress. Config mutations run first; image is applied
            # after registry/secrets.
            wait_containerapp_idle "${RG}" "${APP}" 3 10 allow-inprogress
            STATE="$(az containerapp show -g "${RG}" -n "${APP}" --query properties.provisioningState -o tsv 2>/dev/null || echo Unknown)"
            if containerapp_skip_first_image_update "${STATE}"; then
              dump_containerapp_diagnostics "${RG}" "${APP}"
              echo "::warning::Skipping first image update on '${APP}' because provisioningState=${STATE} (run 34635028916). Ingress/identity/registry/secrets run next."
              # Run 34870272068: Active Unhealthy latestRevision blocked every
              # later ingress LRO. Deactivate it before config mutations.
              deactivate_stuck_containerapp_revisions "${RG}" "${APP}"
            elif [ -n "${ENV_ARGS}" ]; then
              # shellcheck disable=SC2086
              az_containerapp_retry_continue_revision_lro "${RG}" "${APP}" \
                az containerapp update \
                --resource-group "${RG}" \
                --name "${APP}" \
                --image "${IMAGE}" \
                "${RESOURCE_ARGS[@]}" \
                --set-env-vars ${ENV_ARGS}
            else
              az_containerapp_retry_continue_revision_lro "${RG}" "${APP}" \
                az containerapp update \
                --resource-group "${RG}" \
                --name "${APP}" \
                --image "${IMAGE}" \
                "${RESOURCE_ARGS[@]}"
            fi
          else
            if ! create_app; then
              if az containerapp show -g "${RG}" -n "${APP}" >/dev/null 2>&1; then
                echo "::warning::Create returned an error but '${APP}' exists. Continuing (AcrPull is applied later)."
              else
                echo "::error::Failed to create Container App '${APP}'."
                exit 1
              fi
            fi
          fi

          # #region agent log
          echo "debug.session=3a8241 hypothesisId=F create_or_update app=${APP} exists=yes"
          # #endregion

      - name: Ensure ingress target port
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/az-containerapp-mutate.sh
          source "${GITHUB_WORKSPACE}/scripts/ci/az-containerapp-mutate.sh"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ steps.target.outputs.app }}"
          wait_containerapp_idle "${RG}" "${APP}" 3 10 allow-inprogress
          TARGET_PORT="${{ inputs.target_port }}"
          CURRENT_PORT="$(az containerapp show -g "${RG}" -n "${APP}" --query properties.configuration.ingress.targetPort -o tsv 2>/dev/null || true)"
          if containerapp_should_skip_ingress_port "${CURRENT_PORT}" "${TARGET_PORT}"; then
            echo "Ingress target port already ${TARGET_PORT}; skipping update (run 34870272068)."
          else
            # ingress update has no --no-wait (run 35108043923). Continue
            # only on revision LRO expire if the app still exists.
            az_containerapp_retry_continue_revision_lro "${RG}" "${APP}" \
              az containerapp ingress update \
              --resource-group "${RG}" \
              --name "${APP}" \
              --type external \
              --target-port "${TARGET_PORT}"
          fi

      - name: Ensure ingress session affinity (required for SignalR)
        if: inputs.enable_session_affinity
        shell: bash
        run: |
          set -euo pipefail
          # Sticky sessions are mandatory for SignalR (negotiate → websocket
          # must hit the same replica) whenever max_replicas > 1.
          # `az containerapp ingress sticky-sessions set` is GA from az CLI
          # 2.45 (Jan-2023). `azure/login@v2` provisions a current CLI on the
          # runner, so we can rely on the command being present.
          if ! az containerapp ingress sticky-sessions set --help >/dev/null 2>&1; then
            echo "::warning::'az containerapp ingress sticky-sessions set' not available — upgrade az CLI to >=2.45 on the runner. Skipping affinity configuration."
            exit 0
          fi
          # shellcheck source=scripts/ci/az-containerapp-mutate.sh
          source "${GITHUB_WORKSPACE}/scripts/ci/az-containerapp-mutate.sh"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ steps.target.outputs.app }}"
          wait_containerapp_idle "${RG}" "${APP}" 3 10 allow-inprogress
          CURRENT_AFFINITY="$(az containerapp show -g "${RG}" -n "${APP}" --query properties.configuration.ingress.stickySessions.affinity -o tsv 2>/dev/null || true)"
          if containerapp_should_skip_ingress_affinity "${CURRENT_AFFINITY}" sticky; then
            echo "Ingress session affinity already sticky; skipping update (run 34870272068)."
          else
            # sticky-sessions set has no --no-wait. Continue only on revision
            # LRO expire if the app still exists (run 34870272068).
            az_containerapp_retry_continue_revision_lro "${RG}" "${APP}" \
              az containerapp ingress sticky-sessions set \
              --resource-group "${RG}" \
              --name "${APP}" \
              --affinity sticky
          fi

      - name: Ensure system-assigned managed identity
        if: inputs.assign_managed_identity
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/az-containerapp-mutate.sh
          source "${GITHUB_WORKSPACE}/scripts/ci/az-containerapp-mutate.sh"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ steps.target.outputs.app }}"
          wait_containerapp_idle "${RG}" "${APP}" 3 10 allow-inprogress
          IDENT_TYPE="$(az containerapp show -g "${RG}" -n "${APP}" --query identity.type -o tsv 2>/dev/null || true)"
          if containerapp_has_system_identity "${IDENT_TYPE}"; then
            echo "System-assigned identity already present (${IDENT_TYPE}); skipping assign (run 34870272068)."
          else
            # identity assign has no --no-wait (run 35108043923). Continue
            # only on revision LRO expire if the app still exists.
            az_containerapp_retry_continue_revision_lro "${RG}" "${APP}" \
              az containerapp identity assign \
              --resource-group "${RG}" \
              --name "${APP}" \
              --system-assigned
          fi

          SQL_CLIENT_ID="${{ vars.ATO_DATABASE__MANAGEDIDENTITYCLIENTID || '' }}"
          if [ -n "${SQL_CLIENT_ID}" ]; then
            SQL_IDENTITY_ID=$(az identity list \
              --resource-group "${RG}" \
              --query "[?clientId=='${SQL_CLIENT_ID}'].id | [0]" -o tsv)
            test -n "${SQL_IDENTITY_ID}" || (echo "Managed identity with client ID '${SQL_CLIENT_ID}' was not found in '${RG}'" && exit 1)

            CURRENT_SQL_IDENTITY=$(az containerapp show \
              --resource-group "${RG}" \
              --name "${APP}" \
              --query "identity.userAssignedIdentities.\"${SQL_IDENTITY_ID}\".clientId" -o tsv)
            if [ "${CURRENT_SQL_IDENTITY}" = "${SQL_CLIENT_ID}" ]; then
              echo "SQL user-assigned identity already present; skipping assign."
            else
              az_containerapp_retry_continue_revision_lro "${RG}" "${APP}" \
                az containerapp identity assign \
                --resource-group "${RG}" \
                --name "${APP}" \
                --user-assigned "${SQL_IDENTITY_ID}"
            fi
          fi

      # Grant the app's pull identity AcrPull on this ACR (least-privilege).
      # Run 34989521743 / #873: OIDC cannot write roleAssignments. A name-only
      # lookup plus hard-fail ignored an already-bound registry and Healthy
      # latestReady revision. Skip create when assignment exists; on
      # AuthorizationFailed continue when pull already works.
      - name: Grant AcrPull to managed identity (least-privilege)
        if: inputs.assign_managed_identity
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/az-containerapp-mutate.sh
          source "${GITHUB_WORKSPACE}/scripts/ci/az-containerapp-mutate.sh"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ steps.target.outputs.app }}"
          ACR_NAME="${{ vars.AZURE_ACR_NAME }}"
          LOGIN_SERVER="${{ steps.acr.outputs.login_server }}"

          # Bind + latestReady are the pull-already-works signal (run 34989521743).
          # Query them before grant so AuthorizationFailed can continue instead of
          # treating a name-only lookup miss as "AcrPull is missing".
          BOUND_IDENTITY="$(az containerapp show -g "${RG}" -n "${APP}" --query "properties.configuration.registries[?server=='${LOGIN_SERVER}'].identity | [0]" -o tsv 2>/dev/null || true)"
          LATEST_READY="$(az containerapp show -g "${RG}" -n "${APP}" --query properties.latestReadyRevisionName -o tsv 2>/dev/null || true)"
          LATEST_READY_HEALTH=""
          if [ -n "${LATEST_READY}" ]; then
            LATEST_READY_HEALTH="$(az containerapp revision show -g "${RG}" -n "${APP}" --revision "${LATEST_READY}" --query properties.healthState -o tsv 2>/dev/null || true)"
          fi

          EXPECTED_IDENTITY="system"
          if [ -n "${BOUND_IDENTITY}" ] && [ "${BOUND_IDENTITY}" != "system" ]; then
            PRINCIPAL_ID="$(az identity show --ids "${BOUND_IDENTITY}" --query principalId -o tsv)"
            EXPECTED_IDENTITY="${BOUND_IDENTITY}"
          else
            PRINCIPAL_ID="$(az containerapp show --resource-group "${RG}" --name "${APP}" --query identity.principalId -o tsv)"
          fi

          if [ -z "${PRINCIPAL_ID}" ]; then
            if containerapp_acrpull_pull_already_works "${BOUND_IDENTITY}" "${EXPECTED_IDENTITY}" "${LATEST_READY}" "${LATEST_READY_HEALTH}"; then
              echo "::warning::No managed identity principal on '${APP}', but registry/latestReady already pull from ${LOGIN_SERVER}. Skipping AcrPull grant (run 34989521743)."
            else
              echo "::warning::No managed identity found on '${APP}'; skipping AcrPull grant."
            fi
          else
            ACR_ID=$(az acr show -g "${RG}" -n "${ACR_NAME}" --query id -o tsv)

            existing_acrpull() {
              # ARM filter: --assignee-object-id (not Graph --assignee).
              # Match AcrPull by name or well-known role GUID.
              az role assignment list \
                --scope "${ACR_ID}" \
                --assignee-object-id "${PRINCIPAL_ID}" \
                --include-inherited \
                --query "$(containerapp_acrpull_jmespath)" \
                -o tsv
            }

            EXISTING=""
            if ! EXISTING="$(existing_acrpull)"; then
              echo "::warning::Could not list AcrPull assignments at ${ACR_NAME} for ${PRINCIPAL_ID}. Treating lookup as unknown (run 34989521743)."
              EXISTING=""
            fi

            if [ -n "${EXISTING}" ]; then
              echo "AcrPull already assigned on ${ACR_NAME} for ${APP} (${PRINCIPAL_ID}). Skipping create."
            else
              ASSIGN_OUT="$(mktemp)"
              if az role assignment create \
                --assignee-object-id "${PRINCIPAL_ID}" \
                --assignee-principal-type ServicePrincipal \
                --role AcrPull \
                --scope "${ACR_ID}" >"${ASSIGN_OUT}" 2>&1; then
                cat "${ASSIGN_OUT}"
                echo "Granted AcrPull on ${ACR_NAME} to ${APP} (${PRINCIPAL_ID})."
              else
                cat "${ASSIGN_OUT}"
                if grep -qiE 'already exists|RoleAssignmentExists' "${ASSIGN_OUT}"; then
                  echo "AcrPull assignment already exists (create reported exists). Continuing."
                elif grep -qiE 'AuthorizationFailed|roleAssignments/write' "${ASSIGN_OUT}"; then
                  EXISTING=""
                  if EXISTING="$(existing_acrpull)"; then
                    :
                  else
                    echo "::warning::Re-list after AuthorizationFailed also failed. Treating lookup as unknown (run 34989521743)."
                    EXISTING=""
                  fi
                  HAS_ASSIGNMENT=0
                  [ -n "${EXISTING}" ] && HAS_ASSIGNMENT=1
                  ADMIN_CMD="az role assignment create --assignee-object-id ${PRINCIPAL_ID} --assignee-principal-type ServicePrincipal --role AcrPull --scope ${ACR_ID}"
                  if containerapp_acrpull_continue_on_authorization_failed \
                    "${HAS_ASSIGNMENT}" "${BOUND_IDENTITY}" "${EXPECTED_IDENTITY}" \
                    "${LATEST_READY}" "${LATEST_READY_HEALTH}"; then
                    echo "::warning::OIDC principal cannot grant AcrPull (roleAssignments/write AuthorizationFailed). Pull already works or assignment is present for ${APP}. Continuing to secrets/image (run 34989521743)."
                    echo "::warning::Admin grant (optional; CD will not retry as a hard failure): ${ADMIN_CMD}"
                  else
                    echo "::error::OIDC principal cannot grant AcrPull and no existing AcrPull assignment was found for ${APP}."
                    echo "::error::The app has no registry bind and no healthy latestReady revision, so it cannot pull until an Azure admin grants AcrPull on ${ACR_NAME}."
                    echo "${ADMIN_CMD}"
                    echo "::error::Optional (so CD can self-heal): grant the CD OIDC SP Microsoft.Authorization/roleAssignments/write on ACR ${ACR_NAME} only."
                    rm -f "${ASSIGN_OUT}"
                    exit 1
                  fi
                else
                  echo "::error::Unexpected role assignment failure (not already-exists / AuthorizationFailed)."
                  rm -f "${ASSIGN_OUT}"
                  exit 1
                fi
              fi
              rm -f "${ASSIGN_OUT}"
            fi
          fi

          # registry set is an ACA mutation — run 33883971872 left OperationInProgress here.
          # Run 34870272068: registry was already bound; re-setting it started
          # another revision LRO that can expire before apply-image.
          wait_containerapp_idle "${RG}" "${APP}" 3 10 allow-inprogress
          if containerapp_registry_already_bound "${BOUND_IDENTITY}" "${EXPECTED_IDENTITY}"; then
            echo "Registry '${LOGIN_SERVER}' already bound with identity=${BOUND_IDENTITY}; skipping registry set (run 34870272068)."
          else
            # registry set has no --no-wait (run 35108043923). Continue
            # only on revision LRO expire if the app still exists.
            az_containerapp_retry_continue_revision_lro "${RG}" "${APP}" \
              az containerapp registry set \
              --resource-group "${RG}" \
              --name "${APP}" \
              --server "${LOGIN_SERVER}" \
              --identity system
          fi

      - name: Set optional runtime secrets
        if: inputs.inject_runtime_secrets
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/az-containerapp-mutate.sh
          source "${GITHUB_WORKSPACE}/scripts/ci/az-containerapp-mutate.sh"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ steps.target.outputs.app }}"

          # One secret-set mutation (run 33883971872 raced the first of three).
          SECRETS=()
          if [ -n "${{ secrets.ATO_DB_CONNECTION_STRING || '' }}" ]; then
            SECRETS+=("db-connection-string=${{ secrets.ATO_DB_CONNECTION_STRING }}")
          fi
          if [ -n "${{ secrets.ATO_AZUREAI_APIKEY || '' }}" ]; then
            SECRETS+=("azureai-apikey=${{ secrets.ATO_AZUREAI_APIKEY }}")
          fi
          if [ -n "${{ secrets.ATO_AZUREAD_CLIENTSECRET || '' }}" ]; then
            SECRETS+=("azuread-client-secret=${{ secrets.ATO_AZUREAD_CLIENTSECRET }}")
          fi

          if [ "${#SECRETS[@]}" -eq 0 ]; then
            echo "No runtime secrets provided; skipping secret set."
            exit 0
          fi

          wait_containerapp_idle "${RG}" "${APP}" 3 10 allow-inprogress
          # secret set has no --no-wait (run 35108043923). Continue only
          # on revision LRO expire if the app still exists.
          az_containerapp_retry_continue_revision_lro "${RG}" "${APP}" \
            az containerapp secret set \
            -g "${RG}" \
            -n "${APP}" \
            --secrets "${SECRETS[@]}"

      - name: Apply image after registry and secrets
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/az-containerapp-mutate.sh
          source "${GITHUB_WORKSPACE}/scripts/ci/az-containerapp-mutate.sh"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ steps.target.outputs.app }}"
          IMAGE="${{ inputs.image }}"
          ENV_ARGS="${{ steps.envargs.outputs.with_secrets }}"
          if [ -z "${ENV_ARGS}" ]; then
            ENV_ARGS="${{ steps.envargs.outputs.base }}"
          fi

          # Run 34870272068: deactivate the Unhealthy latestRevision first so
          # Azure is not blocked on ActivationFailed 0000113. --no-wait when
          # Failed; smoke checks the latest ready / ingress, not the LRO.
          wait_containerapp_idle "${RG}" "${APP}" 3 10 allow-inprogress
          deactivate_stuck_containerapp_revisions "${RG}" "${APP}"
          STATE="$(az containerapp show -g "${RG}" -n "${APP}" --query properties.provisioningState -o tsv 2>/dev/null || echo Unknown)"
          if [ -n "${ENV_ARGS}" ]; then
            # shellcheck disable=SC2086,SC2046
            az_containerapp_retry_continue_revision_lro "${RG}" "${APP}" \
              az containerapp update \
              --resource-group "${RG}" \
              --name "${APP}" \
              --image "${IMAGE}" \
              --set-env-vars ${ENV_ARGS} \
              $(containerapp_no_wait_if_terminal "${STATE}" update)
          else
            # shellcheck disable=SC2046
            az_containerapp_retry_continue_revision_lro "${RG}" "${APP}" \
              az containerapp update \
              --resource-group "${RG}" \
              --name "${APP}" \
              --image "${IMAGE}" \
              $(containerapp_no_wait_if_terminal "${STATE}" update)
          fi

      - name: Reconcile SQL firewall to app egress IPs
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.target.outputs.app }}"
          APP_RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          DB_CONN="${{ secrets.ATO_DB_CONNECTION_STRING }}"

          if [ -z "$DB_CONN" ]; then
            echo "No ATO_DB_CONNECTION_STRING provided; skipping SQL firewall reconciliation."
            exit 0
          fi

          SQL_FQDN=$(echo "$DB_CONN" | sed -nE 's/.*Server=tcp:([^,;]+).*/\1/p')
          if [ -z "$SQL_FQDN" ]; then
            SQL_FQDN=$(echo "$DB_CONN" | sed -nE 's/.*Server=([^,;]+).*/\1/p')
          fi
          if [ -z "$SQL_FQDN" ]; then
            echo "::warning::Could not parse SQL server FQDN from ATO_DB_CONNECTION_STRING; skipping firewall reconciliation."
            exit 0
          fi

          SQL_SERVER="${SQL_FQDN%%.*}"
          SQL_RG=$(az resource list \
            --resource-type Microsoft.Sql/servers \
            --name "$SQL_SERVER" \
            --query "[0].resourceGroup" -o tsv 2>/dev/null || true)

          if [ -z "$SQL_RG" ]; then
            echo "::warning::SQL server '$SQL_SERVER' not found in subscription; skipping firewall reconciliation."
            exit 0
          fi

          SQL_PUBLIC_ACCESS=$(az sql server show \
            --resource-group "$SQL_RG" \
            --name "$SQL_SERVER" \
            --query publicNetworkAccess -o tsv 2>/dev/null || echo "Unknown")

          if [ "$SQL_PUBLIC_ACCESS" = "Disabled" ]; then
            echo "SQL server '$SQL_SERVER' has publicNetworkAccess=Disabled; skipping firewall reconciliation."
            exit 0
          fi

          OUTBOUND_IPS=$(az containerapp show \
            -g "$APP_RG" -n "$APP" \
            --query "properties.outboundIpAddresses" -o tsv 2>/dev/null || true)
          if [ -z "$OUTBOUND_IPS" ]; then
            echo "::warning::No outbound IPs resolved for app '$APP'; leaving existing SQL firewall rules unchanged."
            exit 0
          fi

          APP_SAFE=$(echo "$APP" | tr -cd '[:alnum:]-' | cut -c1-30)
          RULE_PREFIX="Allow-${APP_SAFE}-"

          DESIRED_RULES=""
          for IP in $OUTBOUND_IPS; do
            RULE_NAME="${RULE_PREFIX}${IP//./-}"
            DESIRED_RULES+="${RULE_NAME}"$'\n'
            az sql server firewall-rule create \
              --resource-group "$SQL_RG" \
              --server "$SQL_SERVER" \
              --name "$RULE_NAME" \
              --start-ip-address "$IP" \
              --end-ip-address "$IP" >/dev/null
          done

          EXISTING_RULES=$(az sql server firewall-rule list \
            --resource-group "$SQL_RG" \
            --server "$SQL_SERVER" \
            --query "[?starts_with(name, '${RULE_PREFIX}')].name" -o tsv)

          for RULE in $EXISTING_RULES; do
            if ! grep -qx "$RULE" <<< "$DESIRED_RULES"; then
              az sql server firewall-rule delete \
                --resource-group "$SQL_RG" \
                --server "$SQL_SERVER" \
                --name "$RULE" >/dev/null || true
            fi
          done

          # Ensure permissive fallback is not retained.
          az sql server firewall-rule delete \
            --resource-group "$SQL_RG" \
            --server "$SQL_SERVER" \
            --name AllowAzureServices >/dev/null 2>&1 || true

          echo "### SQL Firewall Reconciliation" >> "$GITHUB_STEP_SUMMARY"
          echo "- SQL Server: ${SQL_SERVER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resource Group: ${SQL_RG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: ${APP}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Allowed egress IPs: ${OUTBOUND_IPS}" >> "$GITHUB_STEP_SUMMARY"


      - name: Smoke check deployment
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.target.outputs.app }}"
          URL=$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${APP}" --query properties.configuration.ingress.fqdn -o tsv)
          HEALTH_PATH="${{ inputs.health_path }}"
          echo "Deployed URL (${{ inputs.environment_name }}): https://${URL}"

          HEALTH_OK="false"
          for ATTEMPT in $(seq 1 20); do
            if curl -fsS --max-time 15 "https://${URL}${HEALTH_PATH}" >/tmp/health-response.txt 2>/tmp/health-error.txt; then
              HEALTH_OK="true"
              cat /tmp/health-response.txt
              echo "Health check passed on attempt ${ATTEMPT}."
              break
            fi

            echo "Health check attempt ${ATTEMPT}/20 failed. Waiting 15s before retry..."
            sleep 15
          done

          if [ "$HEALTH_OK" != "true" ]; then
            echo "::error::Health endpoint did not become ready after 5 minutes."
            echo "Recent revision status:"
            az containerapp revision list \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${APP}" \
              --query "[].{name:name,active:properties.active,replicas:properties.replicas,health:properties.healthState,created:properties.createdTime}" -o table || true

            echo "Ingress and latest revision details:"
            az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${APP}" \
              --query "{fqdn:properties.configuration.ingress.fqdn,latestRevision:properties.latestRevisionName,latestReadyRevision:properties.latestReadyRevisionName,provisioningState:properties.provisioningState}" -o json || true

            echo "Last curl error:"
            cat /tmp/health-error.txt || true
            exit 1
          fi

          echo "### Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ inputs.environment_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workload: ${{ inputs.workload }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: ${APP}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ inputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://${URL}" >> "$GITHUB_STEP_SUMMARY"

name: CD - Azure Container Apps (Promoted)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag override
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-azure-promoted
  cancel-in-progress: false

jobs:
  build-image:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev

    outputs:
      mcp_image: ${{ steps.mcp_image.outputs.value }}
      dashboard_image: ${{ steps.dashboard_image.outputs.value }}
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required variables
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="${{ vars.AZURE_RESOURCE_GROUP }}"
          ACR_NAME="${{ vars.AZURE_ACR_NAME }}"

          test -n "${RESOURCE_GROUP}" || (echo "Missing repo variable: AZURE_RESOURCE_GROUP" && exit 1)
          test -n "${ACR_NAME}" || (echo "Missing repo variable: AZURE_ACR_NAME" && exit 1)

      # fix(#765/WM-INFRA-2): Replaced admin-credential fetch with az acr login.
      # The previous step called `az acr credential show` and wrote the ACR admin
      # password to GITHUB_OUTPUT, printing it in plain text in every deploy log.
      # We now use the OIDC-authenticated az CLI session (already established by
      # the Azure login step) to authenticate Docker via `az acr login`, so no
      # credential value is ever fetched, stored, or emitted.
      - name: Get ACR login server
        id: acr
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="${{ vars.AZURE_RESOURCE_GROUP }}"
          ACR_NAME="${{ vars.AZURE_ACR_NAME }}"

          LOGIN_SERVER=$(az acr show -g "${RESOURCE_GROUP}" -n "${ACR_NAME}" --query loginServer -o tsv)
          echo "login_server=${LOGIN_SERVER}" >> "$GITHUB_OUTPUT"

      - name: Docker login to ACR (OIDC)
        shell: bash
        run: |
          # Uses the OIDC-backed az CLI session — no admin credentials needed or emitted.
          az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.image_tag || '' }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${GITHUB_SHA}"
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Compute full MCP image
        id: mcp_image
        shell: bash
        run: |
          set -euo pipefail
          echo "value=${{ steps.acr.outputs.login_server }}/ato-copilot-mcp:${{ steps.tag.outputs.value }}" >> "$GITHUB_OUTPUT"

      - name: Compute full Dashboard image
        id: dashboard_image
        shell: bash
        run: |
          set -euo pipefail
          echo "value=${{ steps.acr.outputs.login_server }}/ato-copilot-dashboard:${{ steps.tag.outputs.value }}" >> "$GITHUB_OUTPUT"

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.mcp_image.outputs.value }}
            ${{ steps.acr.outputs.login_server }}/ato-copilot-mcp:latest

      - name: Build and push Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Ato.Copilot.Dashboard/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.dashboard_image.outputs.value }}
            ${{ steps.acr.outputs.login_server }}/ato-copilot-dashboard:latest

  deploy-dev:
    needs: build-image
    uses: ./.github/workflows/deploy-containerapp-stage.yml
    with:
      environment_name: dev
      workload: mcp
      image: ${{ needs.build-image.outputs.mcp_image }}
      inject_runtime_secrets: true
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ATO_DB_CONNECTION_STRING: ${{ secrets.ATO_DB_CONNECTION_STRING }}
      ATO_AZUREAI_APIKEY: ${{ secrets.ATO_AZUREAI_APIKEY }}
      ATO_AZUREAD_CLIENTSECRET: ${{ secrets.ATO_AZUREAD_CLIENTSECRET }}

  deploy-dev-dashboard:
    needs: [deploy-dev, build-image]
    uses: ./.github/workflows/deploy-containerapp-stage.yml
    with:
      environment_name: dev
      workload: dashboard
      image: ${{ needs.build-image.outputs.dashboard_image }}
      target_port: "8080"
      health_path: /
      include_mcp_env_vars: false
      assign_managed_identity: false
      inject_runtime_secrets: false
      # Feature 411: FORCE_SINGLE_TENANT must always be set so envsubst in
      # nginx.conf can substitute ${FORCE_SINGLE_TENANT}. Without this env var
      # nginx exits with "unknown variable" on startup. CSP dashboard = "" (empty),
      # org-only dashboard = "true" (see deploy-production-dashboard-org below).
      extra_env_vars: "FORCE_SINGLE_TENANT="
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-test:
    needs: [deploy-dev-dashboard, build-image]
    uses: ./.github/workflows/deploy-containerapp-stage.yml
    with:
      environment_name: test
      workload: mcp
      image: ${{ needs.build-image.outputs.mcp_image }}
      inject_runtime_secrets: true
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ATO_DB_CONNECTION_STRING: ${{ secrets.ATO_DB_CONNECTION_STRING }}
      ATO_AZUREAI_APIKEY: ${{ secrets.ATO_AZUREAI_APIKEY }}
      ATO_AZUREAD_CLIENTSECRET: ${{ secrets.ATO_AZUREAD_CLIENTSECRET }}

  deploy-test-dashboard:
    needs: [deploy-test, build-image]
    uses: ./.github/workflows/deploy-containerapp-stage.yml
    with:
      environment_name: test
      workload: dashboard
      image: ${{ needs.build-image.outputs.dashboard_image }}
      target_port: "8080"
      health_path: /
      include_mcp_env_vars: false
      assign_managed_identity: false
      inject_runtime_secrets: false
      extra_env_vars: "FORCE_SINGLE_TENANT="
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-production:
    needs: [deploy-test-dashboard, build-image]
    uses: ./.github/workflows/deploy-containerapp-stage.yml
    with:
      environment_name: production
      workload: mcp
      image: ${{ needs.build-image.outputs.mcp_image }}
      inject_runtime_secrets: true
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ATO_DB_CONNECTION_STRING: ${{ secrets.ATO_DB_CONNECTION_STRING }}
      ATO_AZUREAI_APIKEY: ${{ secrets.ATO_AZUREAI_APIKEY }}
      ATO_AZUREAD_CLIENTSECRET: ${{ secrets.ATO_AZUREAD_CLIENTSECRET }}

  deploy-production-dashboard:
    needs: [deploy-production, build-image]
    uses: ./.github/workflows/deploy-containerapp-stage.yml
    with:
      environment_name: production
      workload: dashboard
      image: ${{ needs.build-image.outputs.dashboard_image }}
      target_port: "8080"
      health_path: /
      include_mcp_env_vars: false
      assign_managed_identity: false
      inject_runtime_secrets: false
      extra_env_vars: "FORCE_SINGLE_TENANT="
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # Feature 411: Org-only (non-CSP) dashboard — same image, same MCP backend,
  # FORCE_SINGLE_TENANT=true forces SingleTenant mode at runtime via nginx
  # sub_filter injection of window.__FORCE_SINGLE_TENANT__. This eliminates
  # the CSP portfolio view, TenantPicker, and ImpersonationBanner for tenants
  # that do not need CSP features.
  deploy-production-dashboard-org:
    needs: [deploy-production-dashboard, build-image]
    uses: ./.github/workflows/deploy-containerapp-stage.yml
    with:
      environment_name: production
      workload: dashboard
      containerapp_name: ca-ato-copilot-dashboard-org-v2
      image: ${{ needs.build-image.outputs.dashboard_image }}
      target_port: "8080"
      health_path: /
      include_mcp_env_vars: false
      assign_managed_identity: false
      inject_runtime_secrets: false
      extra_env_vars: "FORCE_SINGLE_TENANT=true"
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

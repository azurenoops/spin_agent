name: Frontend CI

on:
  push:
    branches: ["**"]
    paths:
      - "src/Ato.Copilot.Chat/ClientApp/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "src/Ato.Copilot.Chat/ClientApp/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: src/Ato.Copilot.Chat/ClientApp

jobs:
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/Ato.Copilot.Chat/ClientApp/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/Ato.Copilot.Chat/ClientApp/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      CI: "true"
      REACT_APP_FEATURE_TRACEABILITY_PANEL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/Ato.Copilot.Chat/ClientApp/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-tests]
    env:
      REACT_APP_FEATURE_TRACEABILITY_PANEL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/Ato.Copilot.Chat/ClientApp/package-lock.json
      - run: npm ci
      - run: npm run build

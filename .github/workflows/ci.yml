name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      m365: ${{ steps.filter.outputs.m365 }}
      oscal: ${{ steps.filter.outputs.oscal }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
            m365:
              - 'extensions/m365/**'
            oscal:
              - 'src/**/Oscal**'
              - 'src/**/oscal**'

  dotnet-build-test:
    name: Build + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Ato.Copilot.sln

      - name: Build
        run: dotnet build Ato.Copilot.sln -c Release --no-restore -nologo

      - name: Run unit tests
        run: dotnet test tests/Ato.Copilot.Tests.Unit/Ato.Copilot.Tests.Unit.csproj -c Release --no-build -nologo --logger trx

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            tests/**/TestResults/*.trx
          if-no-files-found: ignore

  security-bypass-gate:
    name: Auth-Bypass Security Gate (BUG-21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject ALLOW_DEV_AUTH_BYPASS in deployment manifests
        shell: bash
        run: |
          echo "Scanning for ALLOW_DEV_AUTH_BYPASS in deployment/infra files..."
          # Check deployment YAML manifests and Terraform for the bypass flag.
          # .env.example and test fixtures are explicitly excluded.
          FOUND=$(grep -rn "ALLOW_DEV_AUTH_BYPASS"             .github/workflows/             infra/             src/             --include="*.yml"             --include="*.yaml"             --include="*.tf"             --include="*.bicep"             --include="*.json"             --exclude-dir=".git"             2>/dev/null |             grep -v "# BUG-21" |             grep -v "ci.yml" |             grep -v "# example" |             grep -v "# sample" || true)

          if [ -n "$FOUND" ]; then
            echo "::error::ALLOW_DEV_AUTH_BYPASS found in deployment files. Remove it before merging:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No ALLOW_DEV_AUTH_BYPASS detected in deployment manifests."

  vscode-extension-compile:
    name: VS Code Extension Compile
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extensions/vscode

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

  # ---------------------------------------------------------------------------
  # Terraform lint — fmt check + validate on every PR touching infra/**
  # Epic #123 (Task #156)
  # ---------------------------------------------------------------------------
  terraform-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.infra == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: terraform fmt --check
        run: terraform fmt --check -recursive
        working-directory: infra/terraform

      - name: terraform init (no backend)
        run: terraform init -backend=false
        working-directory: infra/terraform

      - name: terraform validate
        run: terraform validate
        working-directory: infra/terraform

  # ---------------------------------------------------------------------------
  # M365 Teams Extension — build + mocha tests on every PR touching extensions/m365/**
  # Epic #129 (T061-01)
  # ---------------------------------------------------------------------------
  m365-test:
    name: M365 Teams Extension
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.m365 == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extensions/m365/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: extensions/m365

      - name: Build (TypeScript compile)
        run: npm run build
        working-directory: extensions/m365

      - name: Run tests
        run: npm test
        working-directory: extensions/m365

  # ---------------------------------------------------------------------------
  # OSCAL 1.1.2 Schema Validation Gate — Epic #122 (Task #153)
  # Runs OscalValidationService unit tests + integration OSCAL export tests.
  # Fails the build if any OSCAL SSP export regresses against the bundled
  # NIST OSCAL 1.1.2 schema (oscal_ssp_schema.json).
  # ---------------------------------------------------------------------------
  oscal-schema-validation:
    name: OSCAL 1.1.2 Schema Validation
    runs-on: ubuntu-latest
    needs: [dotnet-build-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Ato.Copilot.sln

      - name: Build
        run: dotnet build Ato.Copilot.sln -c Release --no-restore -nologo

      - name: Run OSCAL schema validation unit tests
        run: >
          dotnet test tests/Ato.Copilot.Tests.Unit/Ato.Copilot.Tests.Unit.csproj
          -c Release --no-build -nologo
          --filter "FullyQualifiedName~OscalValidationService|FullyQualifiedName~OscalSspExport"
          --logger trx
        env:
          OSCAL_VALIDATION_FAIL_ON_VIOLATIONS: "true"

      - name: Run OSCAL integration tests (export + schema validation)
        run: >
          dotnet test tests/Ato.Copilot.Tests.Integration/Ato.Copilot.Tests.Integration.csproj
          -c Release --no-build -nologo
          --filter "FullyQualifiedName~SspToolsIntegration|FullyQualifiedName~OscalSchemaValidation"
          --logger trx
        env:
          OSCAL_VALIDATION_FAIL_ON_VIOLATIONS: "true"

      - name: Upload OSCAL validation test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oscal-validation-results
          path: |
            tests/**/TestResults/*.trx
          if-no-files-found: ignore



  # ---------------------------------------------------------------------------
  # OSCAL Metaschema Constraint Validation — Feature 076 / T004
  # Runs oscal-cli Docker image to validate generated OSCAL SSP, POA&M, and SAR
  # against NIST Metaschema constraints (beyond JSON Schema — cross-ref integrity,
  # allowed values, conditional required fields).
  # Only triggers when OSCAL service files change.
  # ---------------------------------------------------------------------------
  oscal-cli-metaschema-validation:
    name: OSCAL Metaschema Validation (oscal-cli)
    runs-on: ubuntu-latest
    needs: [oscal-schema-validation, detect-changes]
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.oscal == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Ato.Copilot.sln

      - name: Build
        run: dotnet build Ato.Copilot.sln -c Release --no-restore -nologo

      - name: Generate OSCAL test artifacts for validation
        run: >
          dotnet test tests/Ato.Copilot.Tests.Unit/Ato.Copilot.Tests.Unit.csproj
          -c Release --no-build -nologo
          --filter "FullyQualifiedName~OscalSspExport|FullyQualifiedName~OscalValidation"
          --logger trx
          -- RunConfiguration.TestOutputDir=/tmp/oscal-artifacts
        env:
          OSCAL_EXPORT_ARTIFACTS_DIR: /tmp/oscal-artifacts
          OSCAL_VALIDATION_FAIL_ON_VIOLATIONS: "true"

      - name: Pull oscal-cli Docker image
        run: docker pull ghcr.io/metaschema-framework/oscal-cli:latest

      - name: Validate generated OSCAL artifacts with oscal-cli (Metaschema constraints)
        run: |
          ARTIFACTS_DIR=/tmp/oscal-artifacts
          EXIT_CODE=0

          if ls ${ARTIFACTS_DIR}/*.json 2>/dev/null; then
            for artifact in ${ARTIFACTS_DIR}/*.json; do
              echo "--- Validating: $artifact ---"
              docker run --rm                 -v "${ARTIFACTS_DIR}:/data"                 ghcr.io/metaschema-framework/oscal-cli:latest                 validate "/data/$(basename $artifact)" 2>&1
              if [ $? -ne 0 ]; then
                echo "METASCHEMA VALIDATION FAILED: $artifact"
                EXIT_CODE=1
              fi
            done
          else
            echo "No OSCAL JSON artifacts found in ${ARTIFACTS_DIR} — skipping metaschema validation."
            echo "This is expected when no systems with full compliance data exist in test DB."
          fi

          exit $EXIT_CODE

      - name: Upload OSCAL CLI validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oscal-cli-validation-results
          path: /tmp/oscal-artifacts/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Chat Client — React/Jest unit tests (#2437 TraceabilityPanel CI gate)
  # Runs all ClientApp tests with REACT_APP_FEATURE_TRACEABILITY_PANEL=true
  # so the flag-enabled render path (including freeze-on-stream) is exercised
  # on every PR. Non-blocking advisory step also surfaces flag off-state.
  # ---------------------------------------------------------------------------
  chat-client-tests:
    name: Chat Client Tests (TraceabilityPanel gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Ato.Copilot.Chat/ClientApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/Ato.Copilot.Chat/ClientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests (flag-enabled)
        run: CI=true npm test -- --watchAll=false --forceExit
        env:
          REACT_APP_FEATURE_TRACEABILITY_PANEL: "true"

      - name: Advisory — flag adoption state
        if: always()
        run: |
          if grep -r "REACT_APP_FEATURE_TRACEABILITY_PANEL=true" ../.env* 2>/dev/null; then
            echo "::notice title=TraceabilityPanel::Feature flag is ON in .env — panel is adoption-ready"
          else
            echo "::notice title=TraceabilityPanel::Feature flag is OFF in .env files — set REACT_APP_FEATURE_TRACEABILITY_PANEL=true to enable the panel in non-CI builds"
          fi

  ato-compliance-gate:
    name: ATO Compliance Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ATO compliance gate
        uses: ./.github/actions/ato-compliance-gate
        with:
          scan-paths: src,scripts,docs
          severity-threshold: '2'
          # Set this repository variable if you host MCP externally.
          # Defaults to localhost and still produces annotations if unreachable.
          mcp-server-url: ${{ vars.ATO_MCP_SERVER_URL || 'http://localhost:5000' }}
          fail-on-error: 'true'

  # ---------------------------------------------------------------------------
  # Dashboard production bundle audit — Epic #207 / Task #235
  # Builds the React dashboard in production mode and verifies that simulation
  # mode strings (SimulationPanel, simulate, PostSimulate) are ABSENT from the
  # output bundle. A feature flag that is merely "off" is insufficient for
  # FedRAMP; the code path must be excluded at build time.
  # ---------------------------------------------------------------------------
  dashboard-bundle-audit:
    name: Dashboard Production Bundle Audit (FedRAMP Sim-Mode Gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Ato.Copilot.Dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/Ato.Copilot.Dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build (NODE_ENV=production)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Audit bundle — simulation mode must be absent
        # Fail if any of the simulation-mode identifiers survive tree-shaking.
        # These strings must only exist in dev builds. Their presence in the
        # production bundle is a FedRAMP violation (Epic #207 explicit constraint).
        run: |
          echo "Scanning dist/ for simulation-mode identifiers..."
          FOUND=0
          for PATTERN in "SimulationPanel" "PostSimulate" "simulate?identityId" "SimulationMode"; do
            if grep -r --include="*.js" "$PATTERN" dist/ 2>/dev/null | grep -v "//"; then
              echo "❌ FAIL: found '$PATTERN' in production bundle — simulation code was not tree-shaken"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "✅ PASS: no simulation-mode identifiers found in production bundle"
          else
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # CUI / Unprotected-Path Write Gate — Incident #687 / Issue #639
  # Fails the build if any C# source file writes compliance/CUI payloads to
  # /tmp, /var/tmp, or other world-readable paths.
  # ---------------------------------------------------------------------------
  cui-unprotected-write-gate:
    name: CUI Unprotected-Path Write Gate (Incident #687)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for CUI writes to unprotected paths
        run: |
          echo "Scanning src/ for writes to /tmp or other world-readable paths..."
          FOUND=0

          PATTERNS=(
            'File\.WriteAllText\s*\(\s*"/tmp/'
            'File\.AppendAllText\s*\(\s*"/tmp/'
            'File\.WriteAllBytes\s*\(\s*"/tmp/'
            'new\s+StreamWriter\s*\(\s*"/tmp/'
            'new\s+FileStream\s*\(\s*"/tmp/'
            'File\.WriteAllText\s*\(\s*"/var/tmp/'
            'File\.AppendAllText\s*\(\s*"/var/tmp/'
          )

          for PATTERN in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rEn "$PATTERN" src/ --include="*.cs" 2>/dev/null | grep -v '^\s*//' || true)
            if [ -n "$MATCHES" ]; then
              echo "FAIL: Unprotected CUI write detected:"
              echo "$MATCHES"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "PASS: No CUI writes to unprotected paths detected."
          else
            echo ""
            echo "Fix: use structured logging (ILogger) instead of writing to /tmp."
            echo "Ref: Incident #687, Issue #639"
            exit 1
          fi
